{% extends 'base.html' %}
{% block content %}

<h2>Новый заказ на печать</h2>
<form method="post">
    <label>Что печатать (название):</label>
    <input type="text" name="product_name" required autofocus
           placeholder="Например: Ваза-спираль">

    <label>Филамент (тип пластика):</label>
<input type="text" name="filament_name" list="filament_names" required
       placeholder="PLA, PETG, ABS...">
<datalist id="filament_names">
    {% for f in filament_names %}<option value="{{ f }}">{% endfor %}
</datalist>

<label>Цвет:</label>
<input type="text" name="color" value="белый" required
       placeholder="Например: белый, жёлтый, красный">

    <label>Количество, шт:</label>
    <input type="number" name="quantity" value="1" min="1" required>

    <label>Всего филамента, г :</label>
    <input type="number" name="filament_grams" value="0" min="0" required>

    <label>Дедлайн:</label>
    <input type="date" name="deadline">

    <button type="submit">Сохранить</button>
    <a href="{{ url_for('production') }}">Отмена</a>
</form>

{% endblock %}
